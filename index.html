<!doctype html>
<meta charset="utf-8" />
<title>RoughJS · TSV Loader</title>
<style>
  /* All code comments are in English. */
  body { font-family: ui-sans-serif, system-ui; padding: 12px; }
  .label { font-size: 12px; dominant-baseline: middle; }
  .title { font-size: 11px; }
  #stage { border: 1px solid #ddd; }
</style>

<h3>Load TSV then draw</h3>
<input type="file" id="file" accept=".tsv,.csv,.txt" />
<button id="draw">Draw</button>
<br/><br/>
<svg id="stage" width="1280" height="740"></svg>

<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<script>
  // All code comments are in English.
  const fileInput = document.getElementById('file');
  const drawBtn   = document.getElementById('draw');
  const svg       = document.getElementById('stage');
  const rc        = rough.svg(svg);

  let RAW = "";   // raw text from file

  fileInput.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    RAW = await f.text();
    alert("File loaded: " + f.name + " (" + RAW.length + " chars)");
  });

  drawBtn.addEventListener('click', () => {
    if (!RAW) { alert("Please choose a TSV/CSV file first."); return; }
    const rows = parseTSV(RAW);  // parse into {title, category, yearStart, yearEnd}[]
    render(rows);
  });

  function parseTSV(text) {
    // Minimal TSV/CSV parser that splits by tab first; if no tabs, split by comma.
    const sep = text.includes('\t') ? '\t' : ',';
    const lines = text.trim().split(/\r?\n/);
    const headers = lines.shift().split(sep).map(h => h.trim());
    const idx = Object.fromEntries(headers.map((h,i)=>[h, i]));

    function cell(cols, name, fallback="") {
      return cols[idx[name]] ?? fallback;
    }

    const out = [];
    for (const line of lines) {
      const cols = line.split(sep);
      const title = cell(cols, "Title");
      const category = cell(cols, "Category");
      const year = parseInt(cell(cols, "Year"), 10);
      if (!title || !category || !Number.isFinite(year)) continue;
      out.push({ title, category, yearStart: year, yearEnd: year });
    }
    return out;
  }

  function render(DATA) {
    // Clear old contents
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // Layout
    const PAD_L=140, PAD_R=40, PAD_T=60, PAD_B=40;
    const WIDTH  = svg.viewBox.baseVal?.width || svg.width.baseVal.value;
    const HEIGHT = svg.viewBox.baseVal?.height || svg.height.baseVal.value;

    const LANES = Array.from(new Set(DATA.map(d => d.category)));
    const laneH = Math.floor((HEIGHT - PAD_T - PAD_B) / Math.max(1, LANES.length));

    const minY = Math.min(...DATA.map(d => d.yearStart));
    const maxY = Math.max(...DATA.map(d => d.yearEnd));
    const span = (maxY - minY + 1);

    const yearToX = (y) => PAD_L + ((y - minY) / span) * (WIDTH - PAD_L - PAD_R);

    // lanes
    LANES.forEach((lane, i) => {
      const y = PAD_T + i * laneH;
      svg.appendChild(rc.rectangle(PAD_L, y, WIDTH - PAD_L - PAD_R, laneH - 12, {
        fill:'#f9f9f9', fillStyle:'hachure', hachureGap:10,
        stroke:'#999', roughness:1.2, bowing:1.2
      }));
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', 8);
      label.setAttribute('y', y + laneH/2);
      label.setAttribute('class', 'label');
      label.textContent = lane;
      svg.appendChild(label);
    });

    // axis
    const axisY = PAD_T - 24;
    svg.appendChild(rc.linearPath([[PAD_L, axisY + 22],[WIDTH - PAD_R, axisY + 22]], { stroke: '#333' }));
    for (let y=minY; y<=maxY; y++) {
      const x = yearToX(y);
      svg.appendChild(rc.line(x, axisY+12, x, axisY+22, { stroke: '#333' }));
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', x); t.setAttribute('y', axisY);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','label');
      t.textContent = y; svg.appendChild(t);
    }

    // bars
    DATA.forEach(d => {
      const laneIdx = LANES.indexOf(d.category);
      const yTop = PAD_T + laneIdx * laneH + 10;
      const h = laneH - 32;
      const x1 = yearToX(d.yearStart);
      const x2 = yearToX(d.yearEnd + 0.98);

      svg.appendChild(rc.rectangle(x1, yTop, Math.max(14, x2-x1), h, {
        fill:'#fdfdfd', fillStyle:'cross-hatch', hachureGap:8,
        stroke:'#444', roughness:1.6, bowing:1.3, strokeWidth:1.4
      }));
      svg.appendChild(rc.polygon([
        [x2 + 8, yTop + h/2], [x2, yTop + h/2 - 5], [x2, yTop + h/2 + 5]
      ], { fill:'#fff', stroke:'#444', roughness:1.6 }));

      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', x1 + 6);
      text.setAttribute('y', yTop + h/2);
      text.setAttribute('class','title');
      text.textContent = d.title;
      svg.appendChild(text);
    });
  }
</script>
